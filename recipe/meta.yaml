{% set name = "colour-demosaicing" %}
{% set version = "0.2.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/colour_demosaicing-{{ version }}.tar.gz
  sha256: 0d151f7bbd2cb6d57381fc8adbd05a0236c10753d224af9f1d0717e6c6e08239

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry
  run:
    - colour-science >=0.4.0
    - imageio >=2,<3
    - numpy >=1.19,<2
    - python >={{ python_min }},<3.11
    - scipy >=1.5,<2
    - typing-extensions >=4,<5

test:
  imports:
    - colour_demosaicing
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://www.colour-science.org/colour-demosaicing/
  dev_url: https://github.com/colour-science/colour-demosaicing
  doc_url: https://colour-demosaicing.readthedocs.io/en/latest/reference.html
  summary: CFA (Colour Filter Array) Demosaicing Algorithms for Python
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AndrewAnnex
